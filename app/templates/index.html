<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Transcriber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card.full {
            grid-column: 1 / -1;
        }

        .section {
            margin-bottom: 24px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #60a5fa;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 16px;
            background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
            border-radius: 2px;
        }

        .timer {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #34d399;
            margin: 24px 0;
            padding: 20px;
            background: rgba(52, 211, 153, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(52, 211, 153, 0.2);
            display: none;
        }

        .timer.active {
            display: block;
            animation: pulse-timer 1s infinite;
        }

        @keyframes pulse-timer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-start {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            color: #0f172a;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(52, 211, 153, 0.3);
        }

        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-stop {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(248, 113, 113, 0.3);
        }

        .btn-stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(71, 85, 105, 0.3);
            color: #cbd5e1;
            border: 1px solid rgba(71, 85, 105, 0.5);
            font-size: 13px;
            padding: 10px 16px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(71, 85, 105, 0.5);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        select {
            padding: 10px 12px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            cursor: pointer;
        }

        select:hover {
            border-color: rgba(96, 165, 250, 0.5);
        }

        .status-box {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            border-left: 4px solid;
            font-size: 14px;
        }

        .status-box.show {
            display: block;
        }

        .status-box.info {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #93c5fd;
        }

        .status-box.success {
            background: rgba(52, 211, 153, 0.1);
            border-color: #34d399;
            color: #6ee7b7;
        }

        .status-box.error {
            background: rgba(248, 113, 113, 0.1);
            border-color: #f87171;
            color: #fca5a5;
        }

        .progress-section {
            display: none;
        }

        .progress-section.active {
            display: block;
        }

        .chunk-progress {
            margin-bottom: 20px;
        }

        .chunk-item {
            background: rgba(71, 85, 105, 0.2);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .chunk-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .chunk-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            min-width: 100px;
        }

        .chunk-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
        }

        .chunk-status.processing .dot {
            background: #60a5fa;
            animation: pulse-dot 1.5s infinite;
        }

        .chunk-status.done .dot {
            background: #34d399;
        }

        .chunk-status.error .dot {
            background: #f87171;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chunk-info {
            flex: 1;
            font-size: 13px;
            color: #cbd5e1;
        }

        .chunk-eta {
            font-size: 12px;
            color: #94a3b8;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(71, 85, 105, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa 0%, #34d399 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .transcript-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transcript-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .transcript-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 8px;
            padding: 20px;
            min-height: 250px;
            max-height: 600px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.7;
            font-family: 'Courier New', monospace;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .transcript-box.empty {
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }

        .upload-area {
            border: 2px dashed rgba(96, 165, 250, 0.3);
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: rgba(96, 165, 250, 0.6);
            background: rgba(96, 165, 250, 0.05);
        }

        .upload-area input {
            display: none;
        }

        .upload-text {
            color: #94a3b8;
            font-size: 14px;
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(71, 85, 105, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(96, 165, 250, 0.5);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(34, 197, 94, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Class Transcriber</h1>
            <p>Record lectures and get instant transcription with chunk verification</p>
        </div>

        <div class="grid">
            <div class="card">
                <div id="statusBox" class="status-box"></div>

                <div class="section">
                    <div class="section-title">Settings</div>
                    <div class="control-row">
                        <select id="modelSelect">
                            <option value="tiny">Tiny (fastest)</option>
                            <option value="base" selected>Base (balanced)</option>
                            <option value="small">Small (most accurate)</option>
                        </select>
                        <select id="languageSelect">
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="nl">Dutch</option>
                            <option value="pl">Polish</option>
                            <option value="ja">Japanese</option>
                            <option value="zh">Chinese</option>
                            <option value="ko">Korean</option>
                            <option value="ru">Russian</option>
                            <option value="ar">Arabic</option>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Record</div>
                    <div class="timer" id="timer">00:00</div>
                    <div class="controls">
                        <button id="recordBtn" class="btn-start" onclick="startRecording()">⏺️ Start</button>
                        <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>⏹️ Stop</button>
                        <button class="btn-secondary" onclick="clearAll()">Clear</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Upload</div>
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" accept="audio/*" onchange="uploadFile()">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">Click to upload audio</div>
                        <div class="upload-text" style="font-size: 12px; margin-top: 8px;">Any length supported</div>
                    </div>
                </div>
            </div>

            <div id="progressSection" class="card progress-section">
                <div class="section-title">Progress</div>
                <div id="chunkProgress" class="chunk-progress"></div>
            </div>

            <div class="card full">
                <div class="section">
                    <div class="section-title">Transcript</div>
                    <div class="transcript-container">
                        <div class="transcript-actions">
                            <button class="btn-secondary" id="copyBtn" onclick="copyToClipboard()" style="display: none;">📋 Copy</button>
                            <button class="btn-secondary" id="exportBtn" onclick="exportAsFile()" style="display: none;">💾 Export</button>
                        </div>
                        <div id="transcript" class="transcript-box empty">Transcript will appear here...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStart = null;
        let recordingTimer = null;
        let currentModel = 'base';
        let currentLanguage = 'en';

        const CHUNK_DURATION = 15 * 60 * 1000; // 15 minutes - smaller chunks prevent Whisper context loss

        document.getElementById('modelSelect').addEventListener('change', (e) => {
            currentModel = e.target.value;
        });

        document.getElementById('languageSelect').addEventListener('change', (e) => {
            currentLanguage = e.target.value;
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                isRecording = true;
                recordingStart = Date.now();

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    isRecording = false;
                    if (recordingTimer) clearInterval(recordingTimer);
                    handleRecordingComplete();
                };

                mediaRecorder.start();
                document.getElementById('recordBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('timer').classList.add('active');

                showStatus('🎤 Recording started...', 'info');

                recordingTimer = setInterval(() => {
                    const elapsed = Date.now() - recordingStart;
                    const mins = Math.floor(elapsed / 60000);
                    const secs = Math.floor((elapsed % 60000) / 1000);
                    document.getElementById('timer').textContent =
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 100);
            } catch (err) {
                showStatus('Microphone access denied', 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                document.getElementById('recordBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('timer').classList.remove('active');
            }
        }

        async function handleRecordingComplete() {
            const audioBlob = new Blob(recordedChunks, { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(audioBlob);

            const audioElement = new Audio(audioUrl);
            audioElement.onloadedmetadata = async () => {
                const totalSeconds = Math.ceil(audioElement.duration);
                const totalMinutes = Math.ceil(totalSeconds / 60);

                showStatus(`✓ Recording complete: ${totalMinutes} min(s)`, 'success');
                await transcribeInChunks(audioBlob, totalSeconds);
            };
        }

        async function transcribeInChunks(audioBlob, totalSeconds) {
            const numChunks = Math.ceil(totalSeconds / (30 * 60));

            document.getElementById('progressSection').classList.add('active');
            document.getElementById('chunkProgress').innerHTML = '';

            for (let i = 0; i < numChunks; i++) {
                const div = document.createElement('div');
                div.className = 'chunk-item';
                div.id = `chunk-${i}`;
                div.innerHTML = `
                    <div class="chunk-header">
                        <div class="chunk-status pending" id="status-${i}">
                            <span class="dot"></span>
                        </div>
                        <div class="chunk-info">Chunk ${i + 1}/${numChunks}</div>
                        <div class="chunk-eta" id="eta-${i}"></div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fill-${i}"></div>
                    </div>
                `;
                document.getElementById('chunkProgress').appendChild(div);
            }

            let fullTranscript = '';
            let chunkStartTimes = [];

            for (let i = 0; i < numChunks; i++) {
                updateChunkStatus(i, 'processing');
                chunkStartTimes[i] = Date.now();

                try {
                    const startMs = i * CHUNK_DURATION;
                    const endMs = Math.min((i + 1) * CHUNK_DURATION, totalSeconds * 1000);

                    const chunkBlob = await extractAudioChunk(audioBlob, startMs, endMs);

                    const formData = new FormData();
                    formData.append('file', chunkBlob, `chunk-${i}.wav`);
                    formData.append('model', currentModel);
                    formData.append('language', currentLanguage);

                    const startFetch = Date.now();
                    const response = await fetch('/v1/audio/transcriptions', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    const elapsed = Date.now() - startFetch;

                    updateProgressBar(i, 100);

                    if (data.text && data.text.trim()) {
                        fullTranscript += data.text + ' ';
                    }

                    updateChunkStatus(i, 'done');
                    updateChunkETA(i, elapsed, i + 1, numChunks);

                    document.getElementById('transcript').textContent = fullTranscript.trim();
                    document.getElementById('transcript').classList.remove('empty');

                    document.getElementById('copyBtn').style.display = 'flex';
                    document.getElementById('exportBtn').style.display = 'flex';

                } catch (err) {
                    updateChunkStatus(i, 'error');
                    showStatus(`Error on chunk ${i + 1}: ${err.message}`, 'error');
                    return;
                }
            }

            showStatus('✓ All chunks transcribed!', 'success');
        }

        async function extractAudioChunk(audioBlob, startMs, endMs) {
            const arrayBuffer = await audioBlob.arrayBuffer();
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            const sampleRate = audioBuffer.sampleRate;
            const startSample = Math.floor(startMs * sampleRate / 1000);
            const endSample = Math.floor(endMs * sampleRate / 1000);

            const length = endSample - startSample;
            const offlineContext = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                length,
                sampleRate
            );

            const source = offlineContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineContext.destination);
            source.start(0, startMs / 1000, (endMs - startMs) / 1000);

            const renderedBuffer = await offlineContext.startRendering();
            return audioBufferToWav(renderedBuffer);
        }

        function audioBufferToWav(audioBuffer) {
            const numberOfChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const format = 1;
            const bitDepth = 16;

            const bytesPerSample = bitDepth / 8;
            const blockAlign = numberOfChannels * bytesPerSample;

            const channelData = [];
            for (let i = 0; i < numberOfChannels; i++) {
                channelData.push(audioBuffer.getChannelData(i));
            }

            const length = audioBuffer.length * numberOfChannels * bytesPerSample + 36;
            const arrayBuffer = new ArrayBuffer(length + 8);
            const view = new DataView(arrayBuffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, length, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, audioBuffer.length * numberOfChannels * bytesPerSample, true);

            let offset = 44;
            for (let i = 0; i < audioBuffer.length; i++) {
                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, channelData[channel][i]));
                    view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
                    offset += 2;
                }
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function updateChunkStatus(index, status) {
            const statusEl = document.getElementById(`status-${index}`);
            if (statusEl) {
                statusEl.className = `chunk-status ${status}`;
            }
        }

        function updateProgressBar(index, percent) {
            const fill = document.getElementById(`fill-${index}`);
            if (fill) {
                fill.style.width = percent + '%';
            }
        }

        function updateChunkETA(index, elapsedMs, chunkNum, totalChunks) {
            const etaEl = document.getElementById(`eta-${index}`);
            if (etaEl) {
                const seconds = (elapsedMs / 1000).toFixed(1);
                etaEl.textContent = `${seconds}s`;

                const remainingChunks = totalChunks - chunkNum;
                if (remainingChunks > 0) {
                    const estimatedTotal = (elapsedMs * totalChunks) / 1000;
                    const eta = (estimatedTotal - elapsedMs / 1000).toFixed(0);
                    document.querySelector('.status-box').textContent =
                        `Chunk ${chunkNum}/${totalChunks} done. ETA: ~${eta}s remaining`;
                }
            }
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            document.getElementById('transcript').textContent = '';
            document.getElementById('transcript').classList.remove('empty');
            document.getElementById('copyBtn').style.display = 'none';
            document.getElementById('exportBtn').style.display = 'none';
            showStatus('📝 Loading file...', 'info');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                const totalSeconds = Math.ceil(audioBuffer.duration);
                const numChunks = Math.ceil(totalSeconds / (30 * 60));

                showStatus(`✓ File loaded. Splitting into ${numChunks} chunk(s) of 15 min each...`, 'success');
                await transcribeUploadedChunks(audioBuffer, totalSeconds, numChunks);
            } catch (err) {
                showStatus(`❌ Failed to load file: ${err.message}`, 'error');
            }
        }

        async function transcribeUploadedChunks(audioBuffer, totalSeconds, numChunks) {
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('chunkProgress').innerHTML = '';

            for (let i = 0; i < numChunks; i++) {
                const div = document.createElement('div');
                div.className = 'chunk-item';
                div.id = `chunk-${i}`;
                div.innerHTML = `
                    <div class="chunk-header">
                        <div class="chunk-status pending" id="status-${i}">
                            <span class="dot"></span>
                        </div>
                        <div class="chunk-info">Chunk ${i + 1}/${numChunks}</div>
                        <div class="chunk-eta" id="eta-${i}"></div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="fill-${i}"></div>
                    </div>
                `;
                document.getElementById('chunkProgress').appendChild(div);
            }

            let fullTranscript = '';

            for (let i = 0; i < numChunks; i++) {
                updateChunkStatus(i, 'processing');
                updateProgressBar(i, 0);

                try {
                    const startMs = i * CHUNK_DURATION;
                    const endMs = Math.min((i + 1) * CHUNK_DURATION, totalSeconds * 1000);

                    updateProgressBar(i, 25);
                    const chunkBlob = await extractAudioChunkFromBuffer(audioBuffer, startMs, endMs);

                    updateProgressBar(i, 50);
                    const formData = new FormData();
                    formData.append('file', chunkBlob, `chunk-${i}.wav`);
                    formData.append('model', currentModel);
                    formData.append('language', currentLanguage);

                    const startFetch = Date.now();
                    const response = await fetch('/v1/audio/transcriptions', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    const elapsed = Date.now() - startFetch;

                    updateProgressBar(i, 100);

                    if (data.text && data.text.trim()) {
                        fullTranscript += data.text + ' ';
                    }

                    updateChunkStatus(i, 'done');
                    updateChunkETA(i, elapsed, i + 1, numChunks);

                    document.getElementById('transcript').textContent = fullTranscript.trim();
                    document.getElementById('transcript').classList.remove('empty');
                    document.getElementById('copyBtn').style.display = 'flex';
                    document.getElementById('exportBtn').style.display = 'flex';

                } catch (err) {
                    updateChunkStatus(i, 'error');
                    showStatus(`Error on chunk ${i + 1}: ${err.message}`, 'error');
                    return;
                }
            }

            showStatus('✓ All chunks transcribed!', 'success');
        }

        async function extractAudioChunkFromBuffer(audioBuffer, startMs, endMs) {
            const sampleRate = audioBuffer.sampleRate;
            const startSample = Math.floor(startMs * sampleRate / 1000);
            const endSample = Math.floor(endMs * sampleRate / 1000);

            const length = endSample - startSample;
            const offlineContext = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                length,
                sampleRate
            );

            const source = offlineContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineContext.destination);
            source.start(0, startMs / 1000, (endMs - startMs) / 1000);

            const renderedBuffer = await offlineContext.startRendering();
            return audioBufferToWav(renderedBuffer);
        }

        function copyToClipboard() {
            const text = document.getElementById('transcript').textContent;
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard!');
            });
        }

        function exportAsFile() {
            const text = document.getElementById('transcript').textContent;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `transcript-${new Date().toISOString().slice(0, 10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('File downloaded!');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function clearAll() {
            document.getElementById('transcript').textContent = 'Transcript will appear here...';
            document.getElementById('transcript').classList.add('empty');
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('fileInput').value = '';
            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('statusBox').classList.remove('show');
            document.getElementById('copyBtn').style.display = 'none';
            document.getElementById('exportBtn').style.display = 'none';
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusBox');
            el.textContent = msg;
            el.className = `status-box show ${type}`;
        }
    </script>
</body>
</html>
