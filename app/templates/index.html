<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transcriber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        select:hover {
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #f85759;
            color: white;
        }
        .btn-danger:hover:not(:disabled) {
            background: #e84545;
            transform: translateY(-2px);
        }
        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        .btn-secondary:hover {
            background: #efefef;
        }
        .status {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid;
        }
        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-color: #1976d2;
            display: block;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
            border-color: #c62828;
            display: block;
        }
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #2e7d32;
            display: block;
        }
        .recording-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            font-weight: 600;
            color: #f85759;
        }
        .recording-indicator.active {
            display: flex;
        }
        .recording-dot {
            width: 14px;
            height: 14px;
            background: #f85759;
            border-radius: 50%;
            animation: pulse 0.6s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .transcript-box {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .transcript-box.empty {
            color: #999;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-text {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Live Transcriber</h1>
        <p class="subtitle">Record your voice and get instant transcription</p>

        <div id="status" class="status"></div>

        <div class="section">
            <div class="section-title">Settings</div>
            <div class="controls">
                <select id="modelSelect" onchange="changeModel()">
                    <option value="tiny">Model: Tiny (fast)</option>
                    <option value="base" selected>Model: Base (balanced)</option>
                    <option value="small">Model: Small (accurate)</option>
                </select>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Record</div>
            <div class="controls">
                <button id="recordBtn" class="btn-primary" onclick="startRecording()">🔴 Start Recording</button>
                <button id="stopBtn" class="btn-danger" onclick="stopRecording()" disabled>⏹ Stop</button>
                <button class="btn-secondary" onclick="clearTranscript()">✕ Clear</button>
            </div>
            <div id="recordingIndicator" class="recording-indicator">
                <span class="recording-dot"></span>
                Recording...
            </div>
        </div>

        <div class="section">
            <div class="section-title">Upload File</div>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="audio/*" onchange="uploadFile()">
                <div style="font-size: 28px; margin-bottom: 10px;">📁</div>
                <div class="upload-text">Click to upload or drag audio file here</div>
                <div class="upload-text" style="font-size: 12px; margin-top: 5px;">MP3, WAV, M4A, FLAC, OGG supported</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Transcription</div>
            <div id="transcript" class="transcript-box empty">Transcript will appear here...</div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let isRecording = false;
        let currentModel = 'base';
        let recordingStart = null;
        let recordingTimer = null;
        let chunkTimer = null;

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                isRecording = true;
                recordingStart = Date.now();
                let transcriptSoFar = '';

                mediaRecorder.ondataavailable = async (e) => {
                    if (!e.data.size) return;

                    const blob = new Blob([e.data], { type: 'audio/wav' });
                    const formData = new FormData();
                    formData.append('file', blob, 'chunk.wav');
                    formData.append('model', currentModel);
                    formData.append('language', 'en');

                    try {
                        const response = await fetch('/v1/audio/transcriptions', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await response.json();
                        if (data.text && data.text.trim()) {
                            transcriptSoFar += data.text + ' ';
                            document.getElementById('transcript').textContent = transcriptSoFar;
                            document.getElementById('transcript').classList.remove('empty');
                            showStatus('🎙️ Recording... (Chunk transcribed)', 'info');
                        }
                    } catch (err) {
                        console.error('Chunk error:', err);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (recordingTimer) clearInterval(recordingTimer);
                    if (chunkTimer) clearInterval(chunkTimer);
                    showStatus('✓ Recording complete!', 'success');
                };

                mediaRecorder.start();
                document.getElementById('recordBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('recordingIndicator').classList.add('active');
                document.getElementById('transcript').textContent = '';
                document.getElementById('transcript').classList.remove('empty');
                showStatus('🎙️ Recording started... (next chunk in 20 sec)', 'info');

                // Request chunks every 20 seconds
                chunkTimer = setInterval(() => {
                    if (mediaRecorder && isRecording) {
                        mediaRecorder.requestData();
                    }
                }, 20000);

                // Show recording timer
                recordingTimer = setInterval(() => {
                    const seconds = Math.floor((Date.now() - recordingStart) / 1000);
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
                    showStatus(`🎙️ Recording... ${timeStr} (🔄 Live chunks every 20 sec)`, 'info');
                }, 1000);
            } catch (err) {
                showStatus('Microphone access denied. Please enable microphone access.', 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                if (recordingTimer) clearInterval(recordingTimer);
                if (chunkTimer) clearInterval(chunkTimer);
                mediaRecorder.requestData();
                setTimeout(() => {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(t => t.stop());
                    isRecording = false;
                    document.getElementById('recordBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    document.getElementById('recordingIndicator').classList.remove('active');
                }, 100);
            }
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('model', currentModel);
            formData.append('language', 'en');
            formData.append('response_format', 'verbose_json');

            document.getElementById('transcript').textContent = '';
            document.getElementById('transcript').classList.remove('empty');
            showStatus('📝 Uploading and processing...', 'info');

            try {
                const response = await fetch('/v1/audio/transcriptions', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                if (data.text && data.text.trim()) {
                    document.getElementById('transcript').textContent = data.text;
                    showStatus('✓ Transcription complete!', 'success');
                } else {
                    showStatus('⚠️ No speech detected in file.', 'error');
                }
            } catch (err) {
                showStatus('❌ Upload failed: ' + err.message, 'error');
            }
        }

        function changeModel() {
            currentModel = document.getElementById('modelSelect').value;
            const modelNames = { tiny: 'Tiny (fastest)', base: 'Base (balanced)', small: 'Small (most accurate)' };
            showStatus(`Switched to ${modelNames[currentModel]} model`, 'info');
        }

        function clearTranscript() {
            document.getElementById('transcript').textContent = 'Transcript will appear here...';
            document.getElementById('transcript').classList.add('empty');
            document.getElementById('fileInput').value = '';
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = `status ${type}`;
        }
    </script>
</body>
</html>
