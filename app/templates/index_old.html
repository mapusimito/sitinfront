<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faster Whisper</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --primary: #0f3460;
            --accent: #e94560;
            --text: #eee;
            --muted: #888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: var(--accent); }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 { margin-bottom: 15px; color: var(--accent); font-size: 14px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--primary);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }
        .checkbox-group { display: flex; align-items: center; gap: 8px; }
        .checkbox-group input { width: 18px; height: 18px; }
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: rgba(233,69,96,0.1); }
        .upload-area input { display: none; }
        .upload-icon { font-size: 48px; margin-bottom: 10px; }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--primary); }
        .progress-bar {
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
            overflow: hidden;
            margin: 15px 0;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .status { text-align: center; color: var(--muted); font-size: 14px; }
        .result {
            background: var(--bg);
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .gpu-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg);
            border-radius: 8px;
        }
        .gpu-info { display: flex; gap: 20px; font-size: 13px; }
        .gpu-info span { color: var(--muted); }
        .gpu-info strong { color: var(--text); }
        .lang-switch { position: absolute; top: 20px; right: 20px; }
        .header { position: relative; margin-bottom: 20px; }
        .segment { padding: 8px 0; border-bottom: 1px solid var(--primary); }
        .segment:last-child { border-bottom: none; }
        .segment-time { color: var(--accent); font-size: 12px; margin-right: 10px; }
        .hidden { display: none; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { padding: 8px 16px; background: var(--primary); border-radius: 6px; cursor: pointer; font-size: 13px; }
        .tab.active { background: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Faster Whisper</h1>
            <select class="lang-switch" id="langSwitch" onchange="switchLang(this.value)">
                <option value="en">English</option>
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="ja">日本語</option>
            </select>
        </div>

        <div class="card">
            <h3 data-i18n="params">Parameters</h3>
            <div class="grid">
                <div class="form-group">
                    <label data-i18n="language">Language (auto-detect if empty)</label>
                    <select id="language">
                        <option value="">Auto Detect</option>
                        <option value="en">English</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="ru">Russian</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="task">Task</label>
                    <select id="task">
                        <option value="transcribe">Transcribe</option>
                        <option value="translate">Translate to English</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="output">Output Format</label>
                    <select id="outputFormat">
                        <option value="json">JSON</option>
                        <option value="text">Plain Text</option>
                        <option value="srt">SRT Subtitles</option>
                        <option value="vtt">VTT Subtitles</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="beam">Beam Size</label>
                    <input type="number" id="beamSize" value="5" min="1" max="10">
                </div>
                <div class="form-group">
                    <label data-i18n="batch">Batch Size</label>
                    <input type="number" id="batchSize" value="8" min="1" max="32">
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="vadFilter" checked>
                        <label for="vadFilter" data-i18n="vad">VAD Filter</label>
                    </div>
                    <div class="checkbox-group" style="margin-top:10px">
                        <input type="checkbox" id="wordTimestamps">
                        <label for="wordTimestamps" data-i18n="word_ts">Word Timestamps</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 data-i18n="upload">Upload Audio</h3>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p data-i18n="drop">Drop audio file here or click to select</p>
                <p style="color:var(--muted);font-size:12px;margin-top:10px">MP3, WAV, M4A, FLAC, OGG...</p>
                <input type="file" id="fileInput" accept="audio/*,video/*">
            </div>
            <div id="fileName" style="text-align:center;margin-top:10px;color:var(--muted)"></div>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
            <p class="status" id="status"></p>
            <div style="text-align:center;margin-top:15px">
                <button class="btn" id="transcribeBtn" onclick="transcribe()" disabled data-i18n="start">Start Transcription</button>
            </div>
        </div>

        <div class="card" id="resultCard" style="display:none">
            <h3 data-i18n="result">Result</h3>
            <div class="tabs">
                <div class="tab active" onclick="showTab('formatted')" data-i18n="formatted">Formatted</div>
                <div class="tab" onclick="showTab('raw')" data-i18n="raw">Raw JSON</div>
            </div>
            <div id="formattedResult" class="result"></div>
            <div id="rawResult" class="result hidden"></div>
            <div style="margin-top:15px;text-align:center">
                <button class="btn btn-secondary" onclick="downloadResult()" data-i18n="download">Download</button>
            </div>
        </div>

        <div class="card">
            <h3 data-i18n="gpu">GPU Status</h3>
            <div class="gpu-status">
                <div class="gpu-info">
                    <div><span data-i18n="model_status">Model:</span> <strong id="gpuModelStatus">-</strong></div>
                    <div><span data-i18n="memory">Memory:</span> <strong id="gpuMemory">-</strong></div>
                    <div><span data-i18n="idle">Idle:</span> <strong id="gpuIdle">-</strong></div>
                </div>
                <button class="btn btn-secondary" onclick="offloadGPU()" data-i18n="release">Release GPU</button>
            </div>
        </div>
    </div>

    <script>
        const i18n = {
            en: { params: "Parameters", language: "Language (auto-detect if empty)", task: "Task", output: "Output Format", beam: "Beam Size", batch: "Batch Size", vad: "VAD Filter", word_ts: "Word Timestamps", upload: "Upload Audio", drop: "Drop audio file here or click to select", start: "Start Transcription", result: "Result", formatted: "Formatted", raw: "Raw JSON", download: "Download", gpu: "GPU Status", model_status: "Model:", memory: "Memory:", idle: "Idle:", release: "Release GPU", processing: "Processing...", done: "Done!", error: "Error" },
            "zh-CN": { params: "参数设置", language: "语言（留空自动检测）", task: "任务", output: "输出格式", beam: "Beam Size", batch: "批处理大小", vad: "VAD 过滤", word_ts: "词级时间戳", upload: "上传音频", drop: "拖放音频文件或点击选择", start: "开始转录", result: "结果", formatted: "格式化", raw: "原始 JSON", download: "下载", gpu: "GPU 状态", model_status: "模型:", memory: "显存:", idle: "空闲:", release: "释放显存", processing: "处理中...", done: "完成!", error: "错误" },
            "zh-TW": { params: "參數設置", language: "語言（留空自動檢測）", task: "任務", output: "輸出格式", beam: "Beam Size", batch: "批處理大小", vad: "VAD 過濾", word_ts: "詞級時間戳", upload: "上傳音頻", drop: "拖放音頻文件或點擊選擇", start: "開始轉錄", result: "結果", formatted: "格式化", raw: "原始 JSON", download: "下載", gpu: "GPU 狀態", model_status: "模型:", memory: "顯存:", idle: "空閒:", release: "釋放顯存", processing: "處理中...", done: "完成!", error: "錯誤" },
            ja: { params: "パラメータ", language: "言語（空欄で自動検出）", task: "タスク", output: "出力形式", beam: "Beam Size", batch: "バッチサイズ", vad: "VAD フィルター", word_ts: "単語タイムスタンプ", upload: "音声アップロード", drop: "音声ファイルをドロップまたはクリックして選択", start: "文字起こし開始", result: "結果", formatted: "フォーマット", raw: "生 JSON", download: "ダウンロード", gpu: "GPU ステータス", model_status: "モデル:", memory: "メモリ:", idle: "アイドル:", release: "GPU 解放", processing: "処理中...", done: "完了!", error: "エラー" }
        };
        let currentLang = localStorage.getItem("lang") || "en";
        let currentResult = null;
        let selectedFile = null;

        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem("lang", lang);
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (i18n[lang][key]) el.textContent = i18n[lang][key];
            });
            document.getElementById("langSwitch").value = lang;
        }

        function showTab(tab) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            event.target.classList.add("active");
            document.getElementById("formattedResult").classList.toggle("hidden", tab !== "formatted");
            document.getElementById("rawResult").classList.toggle("hidden", tab !== "raw");
        }

        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");

        uploadArea.onclick = () => fileInput.click();
        uploadArea.ondragover = e => { e.preventDefault(); uploadArea.classList.add("dragover"); };
        uploadArea.ondragleave = () => uploadArea.classList.remove("dragover");
        uploadArea.ondrop = e => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = () => { if (fileInput.files.length) handleFile(fileInput.files[0]); };

        function handleFile(file) {
            selectedFile = file;
            document.getElementById("fileName").textContent = file.name;
            document.getElementById("transcribeBtn").disabled = false;
        }

        async function transcribe() {
            if (!selectedFile) return;
            
            const btn = document.getElementById("transcribeBtn");
            const progress = document.getElementById("progressBar");
            const status = document.getElementById("status");
            
            btn.disabled = true;
            progress.classList.add("active");
            document.getElementById("progressFill").style.width = "50%";
            status.textContent = i18n[currentLang].processing;
            
            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("language", document.getElementById("language").value);
            formData.append("task", document.getElementById("task").value);
            formData.append("output_format", document.getElementById("outputFormat").value);
            formData.append("beam_size", document.getElementById("beamSize").value);
            formData.append("batch_size", document.getElementById("batchSize").value);
            formData.append("vad_filter", document.getElementById("vadFilter").checked);
            formData.append("word_timestamps", document.getElementById("wordTimestamps").checked);
            
            try {
                const res = await fetch("/api/transcribe", { method: "POST", body: formData });
                const contentType = res.headers.get("content-type");
                
                document.getElementById("progressFill").style.width = "100%";
                
                if (contentType.includes("application/json")) {
                    currentResult = await res.json();
                    if (currentResult.error) throw new Error(currentResult.error);
                    
                    document.getElementById("rawResult").textContent = JSON.stringify(currentResult, null, 2);
                    
                    if (currentResult.segments) {
                        const formatted = currentResult.segments.map(s => 
                            `<div class="segment"><span class="segment-time">[${formatTime(s.start)} → ${formatTime(s.end)}]</span>${s.text}</div>`
                        ).join("");
                        document.getElementById("formattedResult").innerHTML = formatted;
                    } else {
                        document.getElementById("formattedResult").textContent = currentResult.text || JSON.stringify(currentResult);
                    }
                } else {
                    currentResult = await res.text();
                    document.getElementById("formattedResult").textContent = currentResult;
                    document.getElementById("rawResult").textContent = currentResult;
                }
                
                document.getElementById("resultCard").style.display = "block";
                status.textContent = i18n[currentLang].done;
            } catch (err) {
                status.textContent = `${i18n[currentLang].error}: ${err.message}`;
            } finally {
                btn.disabled = false;
                setTimeout(() => { progress.classList.remove("active"); }, 1000);
            }
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = (s % 60).toFixed(2);
            return `${m}:${sec.padStart(5, "0")}`;
        }

        function downloadResult() {
            const format = document.getElementById("outputFormat").value;
            const ext = { json: "json", text: "txt", srt: "srt", vtt: "vtt" }[format];
            const content = typeof currentResult === "string" ? currentResult : JSON.stringify(currentResult, null, 2);
            const blob = new Blob([content], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `transcription.${ext}`;
            a.click();
        }

        async function offloadGPU() {
            await fetch("/api/gpu/offload", { method: "POST" });
            updateGPUStatus();
        }

        async function updateGPUStatus() {
            try {
                const res = await fetch("/api/gpu/status");
                const data = await res.json();
                document.getElementById("gpuModelStatus").textContent = data.model_loaded ? "Loaded" : "Unloaded";
                document.getElementById("gpuIdle").textContent = data.idle_seconds + "s";
                if (data.gpu) {
                    document.getElementById("gpuMemory").textContent = `${data.gpu.memory_used_mb}/${data.gpu.memory_total_mb} MB`;
                }
            } catch (e) {}
        }

        switchLang(currentLang);
        updateGPUStatus();
        setInterval(updateGPUStatus, 5000);
    </script>
</body>
</html>
