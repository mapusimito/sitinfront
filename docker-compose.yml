services:
  sitinfront:
    build: .
    image: sitinfront:local
    container_name: sitinfront
    ports:
      - "${PORT:-8600}:8600"
    # Unset variables fall through to the app/server.py defaults (MODEL_SIZE
    # large-v3-turbo, DEVICE auto-detected, COMPUTE_TYPE int8 on cpu).
    # Set them in .env or your shell to override.
    environment:
      - PORT=8600
      - MODEL_SIZE
      - DEVICE
      - COMPUTE_TYPE
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-300}
      - KEEP_AUDIO=${KEEP_AUDIO:-0}
    volumes:
      # Downloaded Whisper models (Hugging Face cache).
      - whisper-cache:/root/.cache
      # Run artifacts written by the server.
      - ./runs:/app/runs
    restart: unless-stopped

volumes:
  whisper-cache:
